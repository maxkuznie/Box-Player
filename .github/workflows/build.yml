name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: yes | sdkmanager --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Unzip newest project zip
        run: |
          z=$(git log --name-only --diff-filter=AM --format= -- '*.zip' | grep . | head -1)
          echo "Using: $z"
          unzip -qo "$z"
      - run: cd BoxPlayer && gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BoxPlayer-apk
          path: BoxPlayer/app/build/outputs/apk/debug/app-debug.apk
